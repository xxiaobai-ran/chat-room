<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WebSocket Chat Demo</title>
  <style>
    #messages { border: 1px solid #ccc; height: 300px; overflow-y: scroll; padding: 5px; }
    #input { width: 80%; }
    #send { width: 15%; }
  </style>
</head>
<body>
  <h2>WebSocket Chat Demo</h2>
  <div id="messages"></div>
  <input id="input" type="text" placeholder="Enter message..." />
  <button id="send">Send</button>

  <script>
    const ws = new WebSocket('ws://localhost:8080');
    const messages = document.getElementById('messages');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');

    ws.onopen = () => {
      appendMessage('Connected to the server');
    };

    ws.onmessage = (event) => {
      appendMessage('Friend: ' + event.data);
    };

    ws.onclose = () => {
      appendMessage('Disconnected from the server');
    };

    sendBtn.onclick = () => {
      const msg = input.value;
      if (msg) {
        ws.send(msg);
        appendMessage('You: ' + msg);
        input.value = '';
      }
    };

    input.addEventListener('keyup', (e) => {
      if (e.key === 'Enter') {
        sendBtn.click();
      }
    });

    function appendMessage(msg) {
      const div = document.createElement('div');
      div.textContent = msg;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }
  </script>
</body>
</html>
